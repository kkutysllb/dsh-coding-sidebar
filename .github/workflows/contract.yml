# 插件契约断言（KCoder 仓 docs/plugin-dev-checklist.md §1 / §3 的执行点）。
#
# 两条规则都只能在这里查——KCoder 侧看的是**压缩后的 bundle**，读不出 `ctx.remote.x`
# 这样的源码形态：
#   ① 可选面（服务 / remote 面）只能走 ctx.get / ctx.inject：直接读 `ctx.remote.<面>`
#      会被 cordis 的 inject 强制校验拦下并抛异常；写进 inject 又因 all-required 让插件
#      在缺少该面的载具上整体不挂载。
#   ② `openTab` 要「点了能看见」就必须带 meta：纯 type 的 open 是静默落位，面板收起时
#      用户看不到任何变化（v0.6.17 现场：点任务卡「打开」像是没反应）。确实要有意
#      type-only 的调用点必须就地标注 `// open-tab:type-only — <理由>`。
#
# 同一支脚本也挂在 `pnpm test` 与 `prepack`（发布前必过）上。
name: Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    name: 可选面读法 + openTab 定性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 本仓 package.json 没有 packageManager 字段，必须显式给版本；
          # 用与本地/锁文件同大版本（本机 pnpm v11.x），否则 --frozen-lockfile 会因锁文件版本不符而失败。
          version: 11
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13（setup-node 会调 pnpm 算 store 路径，Node 20 下直接报
          # ERR_UNKNOWN_BUILTIN_MODULE: node:sqlite）。
          node-version: 22
          cache: pnpm
      # --ignore-scripts：本 workflow 只需要 typescript 做 AST 解析与 tsc，
      # 跳过 node-pty 之类原生构建（省时且免装编译工具链）。
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: 契约断言
        run: pnpm check:contract
      - name: 产物与提交一致（敌意环境回归）
        # 回归 2026-09-25 那次「发布包打进 development 构建」：构建模式必须环境无关。
        # 敌意 NODE_ENV 下重建仍须与仓库提交的产物逐字节相同 ⇒ 这条挂了就说明
        # 又有人让环境变量影响产物（那时 npm 上的包会与仓库不同）。
        run: NODE_ENV=development pnpm check:artifacts
      - name: 类型检查
        run: pnpm typecheck
